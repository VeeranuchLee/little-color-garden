<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#7857e8" />
    <meta name="description" content="A simple, voice-guided coloring app made for young children." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Little Color Garden" />
    <title>Little Color Garden</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./cg-back.css" />
    <script src="./cg-update.js" defer></script>
</head>
  <body>
    <main class="app-shell">
      <!-- Top-level mode menu (owner brief, 2026-09-14): Pixel Mosaic and
           coloring-book pages are different activity types and no longer share
           one gallery. This is the app's first screen now, so the hub back
           arrow moved here unchanged -- see the note on the arrow itself.
           Card 3, Mosaic (CG-093, owner decision 2026-09-15), joins the row
           the same way: its own door, its own sheets, and the coloring
           screen's own tap-to-fill beyond them. -->
      <section id="modeMenuScreen" class="screen mode-menu-screen" aria-label="Choose what to make">
        <header class="gallery-header mode-menu-header">
          <!-- Owner, 2026-08-27: *"need to make sure ALL games has back icon to the hub"*
               -- a 4-year-old could not get out of the app. The header was
               [voice][brand][dead spacer]; the arrow takes the left slot, which is where
               it lives in every other game here, and the voice button takes the spacer's
               place instead of a slot that did nothing. Absolute URL on purpose:
               published, /little-color-garden/ and /children-apps/ are siblings, but in
               the repo the hub lives under site/, so a relative link would work live and
               404 in every local preview. -->
          <a class="cg-back" href="https://veeranuchlee.github.io/children-apps/" aria-label="Back to Children Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>

          <div class="brand-mark" aria-hidden="true">
            <span class="brand-star brand-star--one"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span>
            <span class="brand-star brand-star--two"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span>
            <div class="rainbow">
              <i></i><i></i><i></i><i></i>
            </div>
            <div class="paint-smile"><span></span><span></span></div>
          </div>

          <div class="mode-menu-actions">
            <button class="round-button sound-button" id="modeMenuVoice" type="button" aria-label="Hear what to do">
              <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg></span>
            </button>
            <button class="round-button sound-button music-off" id="modeMenuMusic" type="button" aria-label="Play music" aria-pressed="false">
              <span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg></span>
            </button>
          </div>
        </header>

        <div class="mode-menu-body">
          <h1 class="mode-title">What will you make?</h1>

          <div class="mode-cards" role="group" aria-label="Pick a way to play">
          <!-- Codex art (art-source/menu-v2/, approved 2026-09-25): one icon per
               mode, built to assets/menu/ by tools/build-menu-art.py. Pixel's
               canvas preview (rendered live by pixel-mode.js) is retired in
               favor of the same icon treatment as the other four cards. -->
          <button class="mode-card" id="modePixel" type="button" aria-label="Pixel. Copy pictures with little tiles.">
            <span class="mode-art mode-art--icon"><img src="./assets/menu/icon-pixel.webp" alt="" draggable="false" /></span>
            <b class="mode-name">Pixel</b>
            <span class="mode-tag">Copy pictures with little tiles</span>
          </button>
          <button class="mode-card" id="modeColoring" type="button" aria-label="Colouring. Colour a picture, or draw your own.">
            <span class="mode-art mode-art--icon"><img src="./assets/menu/icon-coloring.webp" alt="" draggable="false" /></span>
            <b class="mode-name">Coloring</b>
            <span class="mode-tag">Colour a picture, or draw your own</span>
          </button>
          <button class="mode-card" id="modeMosaic" type="button" aria-label="Mosaic. Tap the shapes to fill them with colour.">
            <span class="mode-art mode-art--icon"><img src="./assets/menu/icon-mosaic.webp" alt="" draggable="false" /></span>
            <b class="mode-name">Mosaic</b>
            <span class="mode-tag">Tap the shapes to fill them with color</span>
          </button>
          <button class="mode-card" id="modeCbn" type="button" aria-label="Color by Number. Match each number to its color.">
            <span class="mode-art mode-art--icon"><img src="./assets/menu/icon-cbn.webp" alt="" draggable="false" /></span>
            <b class="mode-name">Color by Number</b><span class="mode-tag">Match numbers and colors</span>
          </button>
          <button class="mode-card" id="modeStamp" type="button" aria-label="Stamping. Make a picture with stamps.">
            <span class="mode-art mode-art--icon"><img src="./assets/menu/icon-stamping.webp" alt="" draggable="false" /></span>
            <b class="mode-name">Stamping</b><span class="mode-tag">Make a picture with stamps</span>
          </button>
        </div>
        </div>
      </section>

      <!-- The Coloring gallery. No longer the first screen: its top-left arrow
           goes back to the mode menu, and the hub arrow lives on that menu. -->
      <section id="galleryScreen" class="screen gallery-screen" aria-label="Choose a coloring picture" hidden>
        <div class="sky-blob sky-blob--one" aria-hidden="true"></div>
        <div class="sky-blob sky-blob--two" aria-hidden="true"></div>
        <div class="sky-blob sky-blob--three" aria-hidden="true"></div>

        <header class="gallery-header">
          <span class="cg-back-slot" aria-hidden="true"></span><button class="cg-back" id="galleryBackButton" type="button" aria-label="Back to the menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

          <div class="brand-mark" aria-hidden="true">
            <span class="brand-star brand-star--one"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span>
            <span class="brand-star brand-star--two"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span>
            <div class="rainbow">
              <i></i><i></i><i></i><i></i>
            </div>
            <div class="paint-smile"><span></span><span></span></div>
          </div>

        </header>

        <div id="pageGallery" class="page-gallery" role="group" aria-label="Pictures to color"></div>
      </section>

      <section id="coloringScreen" class="screen coloring-screen" aria-label="Coloring page" hidden>
        <header class="top-toolbar">
          <span class="cg-back-slot" aria-hidden="true"></span><button class="cg-back" id="homeButton" type="button" aria-label="Back to the pictures"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="tool-button tool-button--voice" id="voiceButton" type="button" aria-label="Hear what to do">
            <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg></span>
          </button>
          <button class="tool-button tool-button--peek" id="peekButton" type="button" aria-label="Show the finished picture next to yours" aria-pressed="false">
            <span class="peek-glyph" aria-hidden="true">
              <i></i><i></i><i></i>
            </span>
          </button>
          <button class="tool-button tool-button--clear" id="clearButton" type="button" aria-label="Clean the whole picture">
            <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 3.6 13.2 10.8"/><path d="M9.9 8.7 15.3 14.1"/><path d="M10.9 9.7 6.9 13.7"/><path d="M12.6 11.4 8.6 15.4"/><path d="M14.3 13.1 10.3 17.1"/></svg></span>
            <i class="arm-ring" aria-hidden="true"></i>
          </button>
          <button class="tool-button tool-button--finish" id="finishButton" type="button" aria-label="Celebrate my picture">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.9 6.6 19.7l1-6.1L3.2 9.3l6.1-.9z" fill="currentColor"/></svg></span>
          </button>
        </header>

        <div class="canvas-stage" id="canvasStage">
          <figure class="reference-frame" aria-label="Finished picture example">
            <img id="referenceImage" class="reference-image" alt="" draggable="false" />
          </figure>
          <div class="paper-frame">
            <canvas id="paintCanvas" width="724" height="1086" aria-label="Coloring canvas"></canvas>
            <div class="canvas-loader" id="canvasLoader" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>

        <div class="studio-tools" aria-label="Art tools">
          <p class="studio-message" id="studioMessage" aria-live="polite"></p>
          <div class="primary-tools" role="group" aria-label="Choose a tool">
            <button class="primary-tool is-selected" data-tool="brush" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M20.5 3.5 13.3 10.7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M9.9 9.1 14.9 14.1 10.4 16.6 7.4 13.6z" fill="currentColor"/></svg></span><b>Brush</b></button>
            <button class="primary-tool" data-tool="fill" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 9.2a4.5 4.5 0 0 1 9 0"/><path d="M5 9.2h12.2l-1.2 8.1a2.3 2.3 0 0 1-2.3 2H8.5a2.3 2.3 0 0 1-2.3-2z"/><path d="M20.5 12.6c.8 1 1.6 2.1 1.6 3.2a1.6 1.6 0 1 1-3.2 0c0-1.1.8-2.2 1.6-3.2z" fill="currentColor" stroke="none"/></svg></span><b>Fill</b></button>
            <button class="primary-tool" data-tool="gradient" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4.5 16a7.5 7.5 0 0 1 15 0" stroke="#f04455"/><path d="M7 16a5 5 0 0 1 10 0" stroke="#eab215"/><path d="M9.5 16a2.5 2.5 0 0 1 5 0" stroke="#3c83ef"/></svg></span><b>Gradient</b></button>
            <button class="primary-tool" data-tool="stamp" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.5 1-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-1z" fill="currentColor"/></svg></span><b>Stamp</b></button>
            <button class="primary-tool" id="undoButton" type="button" aria-label="Undo last mark" disabled><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 7L4 12l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 12H14a5.5 5.5 0 0 1 0 11h-2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><b>Undo</b></button>
          </div>
          <div class="secondary-tools" id="secondaryTools">
            <div class="tool-options" data-options="brush" role="group" aria-label="Brush controls">
              <button class="size-button" data-size="12" type="button" aria-label="Small brush"><i></i></button>
              <button class="size-button is-selected" data-size="26" type="button" aria-label="Medium brush"><i></i></button>
              <button class="size-button" data-size="48" type="button" aria-label="Big brush"><i></i></button>
              <button class="eraser-button" id="eraserButton" type="button" aria-label="Eraser"><span aria-hidden="true"></span></button>
            </div>
            <div class="tool-options" data-options="fill" role="group" aria-label="Fill controls" hidden><span>Tap a space to fill it.</span></div>
            <div class="tool-options gradient-options" data-options="gradient" role="group" aria-label="Gradient controls" hidden>
              <label>From <input id="gradientStart" type="color" value="#f46eb3" aria-label="Gradient first color"></label>
              <label>To <input id="gradientEnd" type="color" value="#3c83ef" aria-label="Gradient second color"></label>
            </div>
            <div class="tool-options stamp-options" data-options="stamp" role="group" aria-label="Stamp controls" hidden>
              <button class="stamp-choice is-selected" data-stamp="★" type="button" aria-label="Star stamp">★</button>
              <button class="stamp-choice" data-stamp="♥" type="button" aria-label="Heart stamp">♥</button>
              <button class="stamp-choice" data-stamp="✿" type="button" aria-label="Flower stamp">✿</button>
              <label>Size <input id="stampSize" type="range" min="36" max="140" value="72"></label>
              <label>Turn <input id="stampRotation" type="range" min="-180" max="180" value="0"></label>
            </div>
          </div>
          <!-- Landscape's reference card lives here, in flow below the tool
               controls: the canvas column has no room beside the paper (the
               arithmetic is in styles.css), and a card pinned over the art or
               the shelf hides something a child is using. This is a second
               copy of the stage's figure -- portrait draws that one beside
               the paper, and no single parent serves both orientations --
               so app.js mirrors the image src and the peek button's state
               onto it. Portrait never shows this one. -->
          <figure class="reference-frame" id="studioReference" aria-label="Finished picture example" hidden>
            <img id="studioReferenceImage" class="reference-image" alt="" draggable="false" />
          </figure>
        </div>
        <!-- The colours are their own band of the tool surface, never sharing
             the tool row. It is a sibling of .studio-tools rather than a child
             because the two orientations shape it differently: portrait stacks
             it as the last band of the bottom surface, landscape stands it up
             as a four-column shelf in its own right-hand column (the
             arithmetic for both is in TWO-MODE-SPEC §3). -->
        <div id="colorPalette" class="color-palette" role="group" aria-label="Colors"></div>

        <div id="celebration" class="celebration" aria-hidden="true"></div>
      </section>

      <!-- Blank Page: a small child-friendly art toy, expanded 2026-09-28. -->
      <section id="blankScreen" class="screen coloring-screen blank-screen" aria-label="Blank page" hidden>
        <header class="top-toolbar">
          <span class="cg-back-slot" aria-hidden="true"></span><button class="cg-back" id="blankHome" type="button" aria-label="Back to the pictures"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="tool-button tool-button--voice" id="blankVoice" type="button" aria-label="Hear what to do">
            <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg></span>
          </button>
          <!-- Undo/Redo (owner, 2026-10-28: "and what's the gray ones?" -- the
               arrows used to disappear when the buttons were disabled). Both
               wear the shared undo icon; styles.css keeps the arrow visible
               (faded) while disabled and mirrors the Redo copy. -->
          <button class="tool-button blank-history" id="blankUndo" type="button" aria-label="Undo" disabled><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 7L4 12l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 12H14a5.5 5.5 0 0 1 0 11h-2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
          <button class="tool-button blank-history" id="blankRedo" type="button" aria-label="Redo" disabled><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 7L4 12l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 12H14a5.5 5.5 0 0 1 0 11h-2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
          <button class="tool-button tool-button--clear" id="blankClear" type="button" aria-label="Clean the whole page">
            <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 3.6 13.2 10.8"/><path d="M9.9 8.7 15.3 14.1"/><path d="M10.9 9.7 6.9 13.7"/><path d="M12.6 11.4 8.6 15.4"/><path d="M14.3 13.1 10.3 17.1"/></svg></span>
            <i class="arm-ring" aria-hidden="true"></i>
          </button>
          <!-- Turn and mirror the selected sticker (owner request 2026-10-25:
               "we may also need similar thing to sticker in coloring too"). -->
          <div id="blankStickerActions" class="blank-sticker-actions" role="group" aria-label="Turn or flip the sticker" hidden>
            <button class="tool-button tool-button--turn" id="blankStickerRotate" type="button" aria-label="Turn this sticker"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8.2" y="10.4" width="9" height="9" rx="2" transform="rotate(20 12.7 14.9)" fill="currentColor"/><path d="M4.2 13.2A8.2 8.2 0 0 1 17.6 5.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M18.4 1.8v4.4H14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
            <button class="tool-button tool-button--turn" id="blankStickerFlip" type="button" aria-label="Flip this sticker"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5v19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.2 2.8"/><path d="M9.4 6.2v12.3H3.2z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.6 6.2v12.3h6.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span></button>
          </div>
        </header>

        <div class="canvas-stage">
          <div class="paper-frame">
            <canvas id="blankCanvas" width="724" height="1086" aria-label="Blank page. Pick a color, then draw."></canvas>
            <!-- Placed stickers live above the paper, not inside its bitmap, so
                 they stay draggable, resizable and deletable (owner brief,
                 2026-10-05). The layer itself ignores pointers; each sticker
                 takes its own, so the canvas beneath still draws everywhere a
                 sticker is not. -->
            <div id="blankStickers" class="blank-sticker-layer" aria-label="Stickers on the page"></div>
          </div>
        </div>

        <div class="studio-tools" aria-label="Drawing tools">
          <p class="studio-message" id="blankMessage" aria-live="polite"></p>
          <div class="primary-tools blank-tools" role="group" aria-label="Choose a tool">
            <!-- Icon tiles (owner brief, 2026-10-28): one drawn style and weight
                 for all six -- rounded 2.4-weight strokes, pictures from the
                 shared icon set where one exists (pencil, star, sparkle) and
                 matching drawn pictures where the set has none (paint bucket,
                 magic wand, eraser). The icon sits centred above its label. -->
            <button class="primary-tool is-selected" data-blank-tool="brush" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M15 4l5 5L9 20H4v-5z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 6l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><b>Brush</b></button>
            <button class="primary-tool" data-blank-tool="fill" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.2 3.6 3.4 11.4a2 2 0 0 0 0 2.8l4.9 4.9a2 2 0 0 0 2.8 0l7.8-7.8z"/><path d="M20.5 12.6c.8 1 1.6 2.1 1.6 3.2a1.6 1.6 0 1 1-3.2 0c0-1.1.8-2.2 1.6-3.2z" fill="currentColor" stroke="none"/></svg></span><b>Fill</b></button>
            <button class="primary-tool" data-blank-tool="shape" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.9 6.6 19.7l1-6.1L3.2 9.3l6.1-.9z" fill="currentColor"/></svg></span><b>Shapes</b></button>
            <button class="primary-tool" data-blank-tool="stamp" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span><b>Stickers</b></button>
            <button class="primary-tool" data-blank-tool="magic" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 20.2 12.8 11.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M16.7 3.3l1 3.3 3.3 1-3.3 1-1 3.3-1-3.3-3.3-1 3.3-1z" fill="currentColor"/><circle cx="20.7" cy="14" r="1.4" fill="currentColor"/><circle cx="12" cy="5.2" r="1.4" fill="currentColor"/></svg></span><b>Magic</b></button>
            <button class="primary-tool" data-blank-tool="eraser" type="button"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.1 20.6 2.9 16.4a1.9 1.9 0 0 1 0-2.7l9.4-9.4a1.9 1.9 0 0 1 2.7 0l5.3 5.3a1.9 1.9 0 0 1 0 2.7l-8.5 8.3"/><path d="M21.4 20.6H7.1"/><path d="M5.6 11.2l7.3 7.3"/></svg></span><b>Eraser</b></button>
          </div>
          <div id="blankShapeTray" class="blank-choice-tray" aria-label="Choose a shape" hidden>
            <button class="is-selected" data-shape="circle" type="button" aria-label="Circle">●</button><button data-shape="star" type="button" aria-label="Star">★</button><button data-shape="heart" type="button" aria-label="Heart">♥</button><button data-shape="square" type="button" aria-label="Square">■</button><button data-shape="triangle" type="button" aria-label="Triangle">▲</button>
          </div>
          <!-- The Magic picker (owner brief, 2026-10-28: "this magic one -> can
               we have more to select? not only rainbow?"). blank-page.js fills it
               with a tray of brushes, each shown as a small painted sample of its
               own stroke, the way the Shapes tray offers shapes. -->
          <div id="blankMagicTray" class="blank-choice-tray blank-magic-tray" aria-label="Choose a magic brush" hidden></div>
          <div id="blankStampPanel" class="blank-stamp-panel" hidden>
            <div id="blankStampCategories" class="blank-category-tray" aria-label="Sticker categories"></div>
            <div id="blankStampTray" class="blank-stamp-tray" aria-label="Choose a sticker"></div>
          </div>
        </div>

        <div id="blankPalette" class="color-palette" role="group" aria-label="Colors"></div>
      </section>

      <!-- Mosaic gallery, card 3 of the hub (owner decision, 2026-09-15).
           Choosing a sheet works exactly like Coloring's gallery; the board
           beyond a tap here is the coloring screen opened on a mosaic page
           (app.js openPage, kind "mosaic") -- the fill, palette, undo, clear
           and saving are that machinery, not a copy of it. No numbers
           anywhere: that line belongs to card 4, not this one. -->
      <section id="mosaicGalleryScreen" class="screen gallery-screen mosaic-gallery-screen" aria-label="Choose a mosaic picture" hidden>
        <div class="sky-blob sky-blob--one" aria-hidden="true"></div>
        <div class="sky-blob sky-blob--two" aria-hidden="true"></div>
        <div class="sky-blob sky-blob--three" aria-hidden="true"></div>

        <header class="gallery-header">
          <span class="cg-back-slot" aria-hidden="true"></span><button class="cg-back" id="mosaicGalleryBack" type="button" aria-label="Back to the menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

          <div class="brand-mark" aria-hidden="true">
            <span class="brand-star brand-star--one"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span>
            <span class="brand-star brand-star--two"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2c.7 6.2 3.8 9.3 10 10-6.2.7-9.3 3.8-10 10-.7-6.2-3.8-9.3-10-10 6.2-.7 9.3-3.8 10-10z" fill="currentColor"/></svg></span>
            <div class="rainbow">
              <i></i><i></i><i></i><i></i>
            </div>
            <div class="paint-smile"><span></span><span></span></div>
          </div>

          <button class="round-button sound-button" id="mosaicGalleryVoice" type="button" aria-label="Hear what to do">
            <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg></span>
          </button>
        </header>

        <div id="mosaicGallery" class="page-gallery page-gallery--mosaic" role="group" aria-label="Mosaic pictures to color"></div>
      </section>

      <section id="cbnGalleryScreen" class="screen activity-gallery" hidden>
        <header class="activity-header">
          <span class="cg-back-slot" aria-hidden="true"></span><button id="cbnGalleryBack" class="cg-back" type="button" aria-label="Back to the menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h1>Color by Number</h1>
        </header>
        <div id="cbnGallery" class="activity-cards"></div>
      </section>

      <section id="cbnScreen" class="screen activity-workspace cbn-workspace" hidden>
        <header class="activity-header cbn-header">
          <span class="cg-back-slot" aria-hidden="true"></span><button id="cbnBack" class="cg-back" type="button" aria-label="Back to Color by Number pictures"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h1 id="cbnTitle">Color by Number</h1>
          <div id="cbnCelebration" class="activity-message" aria-live="polite"></div>
          <div class="cbn-header-actions">
            <button id="cbnUndo" class="round-button" type="button" aria-label="Undo last color" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 7L4 12l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 12H14a5.5 5.5 0 0 1 0 11h-2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button id="cbnClear" class="round-button tool-button--clear" type="button" aria-label="Clean the whole picture">
              <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 3.6 13.2 10.8"/><path d="M9.9 8.7 15.3 14.1"/><path d="M10.9 9.7 6.9 13.7"/><path d="M12.6 11.4 8.6 15.4"/><path d="M14.3 13.1 10.3 17.1"/></svg></span>
              <i class="arm-ring" aria-hidden="true"></i>
            </button>
            <button id="cbnSave" class="round-button" type="button" aria-label="Save Color by Number picture"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6v10.2"/><path d="M7.6 9.6 12 14l4.4-4.4"/><path d="M4.8 16.4v1.8a2.2 2.2 0 0 0 2.2 2.2h10a2.2 2.2 0 0 0 2.2-2.2v-1.8"/></svg></button>
          </div>
        </header>
        <div class="activity-board">
          <div class="activity-stage">
            <canvas id="cbnCanvas" aria-label="Numbered coloring picture"></canvas>
          </div>
          <div id="cbnPalette" class="cbn-palette" role="group" aria-label="Number colors"></div>
        </div>
      </section>

      <section id="stampGalleryScreen" class="screen activity-gallery" hidden>
        <header class="activity-header">
          <span class="cg-back-slot" aria-hidden="true"></span><button id="stampGalleryBack" class="cg-back" type="button" aria-label="Back to the menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h1>Stamping</h1>
          <button class="round-button sound-button music-off stamp-music" type="button" aria-label="Play music" aria-pressed="false"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg></span></button>
        </header>
        <div id="stampGallery" class="activity-cards"></div>
      </section>

      <section id="stampScreen" class="screen activity-workspace stamp-workspace" hidden>
        <header class="activity-header stamp-header">
          <span class="cg-back-slot" aria-hidden="true"></span><button id="stampBack" class="cg-back" type="button" aria-label="Back to Stamping scenes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h1 id="stampTitle">Stamping</h1>
          <div class="stamp-header-actions">
            <button class="round-button sound-button music-off stamp-music" type="button" aria-label="Play music" aria-pressed="false"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg></span></button>
            <button id="stampUndo" class="round-button" type="button" aria-label="Undo last stamp action"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 7L4 12l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 12H14a5.5 5.5 0 0 1 0 11h-2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button id="stampClear" class="round-button" type="button" aria-label="Clear all stamps"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 3.6 13.2 10.8"/><path d="M9.9 8.7 15.3 14.1"/><path d="M10.9 9.7 6.9 13.7"/><path d="M12.6 11.4 8.6 15.4"/><path d="M14.3 13.1 10.3 17.1"/></svg></button>
            <button id="stampSave" class="round-button" type="button" aria-label="Save stamped picture"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6v10.2"/><path d="M7.6 9.6 12 14l4.4-4.4"/><path d="M4.8 16.4v1.8a2.2 2.2 0 0 0 2.2 2.2h10a2.2 2.2 0 0 0 2.2-2.2v-1.8"/></svg></button>
          </div>
        </header>
        <div class="activity-board stamp-board">
          <div class="activity-stage">
            <canvas id="stampCanvas" aria-label="Stamping canvas"></canvas>
          </div>
          <div class="stamp-controls">
            <div id="stampCategoryTray" class="stamp-category-tray" role="group" aria-label="Choose a stamp group"></div>
            <div id="stampTray" class="stamp-tray" role="group" aria-label="Choose a stamp"></div>
            <div class="stamp-sizes" role="group" aria-label="Stamp size">
              <button data-size="0.12" type="button" aria-label="Small stamp">Small</button>
              <button class="is-selected" data-size="0.18" type="button" aria-label="Medium stamp">Medium</button>
              <button data-size="0.26" type="button" aria-label="Large stamp">Large</button>
              <!-- Turn and mirror the selected stamp (owner request 2026-10-25). They
                   show only while a placed stamp is selected; visibility, not
                   display, so the size buttons never jump sideways. -->
              <button id="stampRotate" class="stamp-transform" type="button" aria-label="Turn this stamp"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8.2" y="10.4" width="9" height="9" rx="2" transform="rotate(20 12.7 14.9)" fill="currentColor"/><path d="M4.2 13.2A8.2 8.2 0 0 1 17.6 5.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M18.4 1.8v4.4H14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <button id="stampFlip" class="stamp-transform" type="button" aria-label="Flip this stamp"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5v19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.2 2.8"/><path d="M9.4 6.2v12.3H3.2z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.6 6.2v12.3h6.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
            </div>
          </div>
        </div>
      </section>

      <!-- Pixel Mosaic mode (owner concept, 2026-08-27): a pegboard-style tile
           toy. Pick a pattern card, copy it on the big board. The palette is
           exactly 36 colors in 3 rows x 12; cards use only those colors. -->
      <section id="pixelGalleryScreen" class="screen px-gallery-screen" aria-label="Pixel mosaic pictures to copy" hidden>
        <header class="gallery-header">
          <span class="cg-back-slot" aria-hidden="true"></span><button class="cg-back" id="pixelGalleryBack" type="button" aria-label="Back to the menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="px-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <button class="round-button sound-button" id="pixelGalleryVoice" type="button" aria-label="Hear what to do">
            <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg></span>
          </button>
        </header>
        <div id="pixelLevels" class="px-levels" role="group" aria-label="How much help"></div>
        <div id="pixelCards" class="px-cards" role="group" aria-label="Pictures to copy"></div>
      </section>

      <section id="pixelBoardScreen" class="screen px-board-screen" aria-label="Pixel mosaic board" hidden>
        <header class="top-toolbar">
          <span class="cg-back-slot" aria-hidden="true"></span><button class="cg-back" id="pixelHome" type="button" aria-label="Back to the cards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="tool-button tool-button--voice" id="pixelVoice" type="button" aria-label="Hear what to do">
            <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg></span>
          </button>
          <button class="tool-button tool-button--undo" id="pixelUndo" type="button" aria-label="Undo last tiles" disabled>
            <span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 7L4 12l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 12H14a5.5 5.5 0 0 1 0 11h-2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <button class="tool-button tool-button--clear" id="pixelClear" type="button" aria-label="Clean the whole board">
            <span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 3.6 13.2 10.8"/><path d="M9.9 8.7 15.3 14.1"/><path d="M10.9 9.7 6.9 13.7"/><path d="M12.6 11.4 8.6 15.4"/><path d="M14.3 13.1 10.3 17.1"/></svg></span>
            <i class="arm-ring" aria-hidden="true"></i>
          </button>
          <button class="tool-button tool-button--finish" id="pixelFinish" type="button" aria-label="Celebrate my mosaic">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.9 6.6 19.7l1-6.1L3.2 9.3l6.1-.9z" fill="currentColor"/></svg></span>
          </button>
          <button class="px-thumb" id="pixelThumb" type="button" aria-label="Show the picture card big">
            <canvas id="pixelThumbCanvas" width="160" height="120" aria-hidden="true"></canvas>
          </button>
        </header>

        <div class="px-stage">
          <div class="px-board-frame" id="pixelBoardFrame">
            <canvas id="pixelBoard" aria-label="Pixel mosaic board. Tap a color, then tap or drag on squares."></canvas>
          </div>
        </div>

        <div class="px-bottom" aria-label="Mosaic tools">
          <button class="eraser-button" id="pixelEraser" type="button" aria-label="Eraser">
            <span aria-hidden="true"></span>
          </button>
          <div id="pixelPalette" class="px-palette" role="group" aria-label="Colors"></div>
        </div>

        <div id="pixelCardOverlay" class="px-overlay" hidden>
          <div class="px-overlay-card">
            <canvas id="pixelCardOverlayCanvas" width="480" height="360" aria-label="The picture to copy"></canvas>
          </div>
        </div>
        <div id="pixelCelebration" class="celebration" aria-hidden="true"></div>
      </section>
    </main>

    <script src="./tap-zoom-guard.js"></script>
    <script src="./audio-wake.js"></script>
    <script src="./app.js"></script>
    <script src="./pixel-cards.js"></script>
    <script src="./pixel-mode.js"></script>
    <script src="./sticker-kit.js"></script>
    <script src="./blank-page.js"></script>
    <script src="./mosaic-mode.js"></script>
    <script src="./cbn-mode.js"></script>
    <script src="./stamp-mode.js"></script>
    <!-- Do NOT re-add a document-level "gesturestart" preventDefault here. It blocks
         every pinch, so a double-tap zoom (which iPadOS Safari still allows even with
         touch-action: manipulation -- observed live on v19) becomes a trap with no way
         out but reloading. The rule and its history: INTERACTION-DIRECTION.md. -->
</body>
</html>
